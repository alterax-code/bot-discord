# =============================================================================
#  IMPORT DES ANCIENS SIGNALEMENTS — À RELIRE AVANT EXÉCUTION
#
#  Reprise des 32 messages postés à la main avant la mise en place du bot.
#  Statuts relevés sur les réactions d'origine : 13 faits, 2 en cours, 17 à faire.
#
#  kind     : "bug" ou "feature"          → détermine l'en-tête et la couleur
#  title    : le titre affiché            → sert aussi de titre dans l'archive
#  detail   : le texte d'origine          → repris tel quel, sans réécriture
#  author   : le pseudo d'origine         → le bot cherchera le compte Discord correspondant
#  statut   : "signale" (❌) | "en_cours" (⚠️) | "valide" (✅)
#
#  Un ticket "valide" ne va PAS dans le salon des tickets : il part directement
#  dans l'archive du jour et dans l'annonce publique, puisqu'il est déjà traité.
#
#  Le classement bug / ajout est déduit du texte. Trois cas ambigus sont
#  signalés par un commentaire « (à confirmer) ».
# =============================================================================

