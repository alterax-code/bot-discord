services:
  bot:
    build: .
    image: grandline-bot:latest
    container_name: grandline-bot

    # « unless-stopped » couvre les deux cas qui comptent : le bot qui plante,
    # et le serveur qui redémarre. Il ne repart PAS si tu l'as arrêté toi-même
    # à la main — sinon impossible de le laisser éteint volontairement.
    restart: unless-stopped

    # Le conteneur tourne sous l'identifiant de l'utilisateur HÔTE, et non
    # sous le compte interne de l'image.
    #
    # Sans cela, le conteneur (uid 10001) ne peut pas écrire dans « data/ »,
    # qui appartient à l'utilisateur du serveur (uid 1000) : la base s'ouvre
    # en lecture seule et le bot refuse de démarrer.
    #
    # L'inverse — donner « data/ » à l'uid du conteneur — casserait la
    # sauvegarde quotidienne, qui s'exécute sur l'hôte : une base SQLite en
    # mode WAL exige un accès en écriture même pour être seulement lue.
    # La panne ne se serait alors révélée que le jour d'une restauration.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"

    # Le jeton vient d'ici. Ce fichier n'est pas dans le dépôt Git et n'entre
    # pas dans l'image : il vit uniquement sur le serveur.
    env_file:
      - .env

    volumes:
      # La base survit à toute reconstruction de l'image. C'est le seul
      # élément réellement irremplaçable du service.
      - ./data:/data

    # Aucun « ports: » — volontairement. Le bot n'accepte aucune connexion
    # entrante. C'est ce qui le rend insensible au contournement d'UFW par
    # Docker : il n'y a rien à exposer.

    networks:
      - grandline

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  grandline:
    external: true
