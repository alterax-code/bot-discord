# =============================================================================
#  Grand Line RP — configuration du bot de tickets
#
#  Ce fichier ne contient AUCUN secret : uniquement des identifiants Discord,
#  qui sont publics par nature. Il est donc versionné dans Git.
#  Le jeton, lui, vit dans « .env », exclu du dépôt.
#
#  Règle du projet : rien de spécifique au serveur ne doit être écrit en dur
#  dans le code. Tout ce qui suit est modifiable sans toucher une ligne de Python.
# =============================================================================

[discord]
# Le serveur Discord de Grand Line RP.
guild_id = 1524700663869870080


[channels]
# Salon staff : les tickets en cours de traitement.
tickets = 1534716188989325522
# Salon staff : la traçabilité complète, un message par jour.
archives = 1534933876885950474
# Salon joueurs : uniquement ce qui a été corrigé ou ajouté.
public = 1534927529905881239


[roles]
# Rôles autorisés à VALIDER (poser la coche verte et déclencher la publication).
# Uniquement des rôles humains du staff — les rôles de bots en sont exclus,
# et « gérant staff » n'y figure pas car il n'a pas accès au salon des tickets.
validators = [
  1533804625206186055,  # passe all
  1524700663924260942,  # direction
  1532717004761469099,  # coordinateur
  1524700663924260941,  # gérant équipe technique
  1524700663924260939,  # admin
  1534183320059908318,  # dev
]


[reactions]
# Les trois statuts. Modifiables, mais changer un émoji en cours de route
# rend les réactions déjà posées sur les tickets ouverts inexploitables.
reported = "❌"      # signalé, rien n'a encore été fait
fixing = "⚠️"        # corrigé ou en cours, reste à tester en ligne
validated = "✅"     # testé et validé SUR LE SERVEUR EN LIGNE


[publication]
# Préfixes des annonces dans le salon joueurs.
prefix_bug = "Correctif :"
prefix_feature = "Ajout :"


[archive]
# Fuseau qui découpe les journées de l'archive. Ne pas changer sans réfléchir :
# il détermine à quelle heure bascule le message du jour.
timezone = "Europe/Paris"
# Seuil de bascule vers une nouvelle page. Discord plafonne la description
# d'un encart à 4096 caractères ; on garde une marge pour l'en-tête et la pagination.
max_page_chars = 3600
# Une entrée d'archive plus longue que cela est tronquée à l'affichage.
# Le texte intégral reste conservé en base, rien n'est perdu.
max_entry_chars = 1200


[display]
# Apparence des tickets. Le type est visible directement dans le message
# (en-tête et couleur), jamais sous forme de réaction.
bug_label = "🐛 Bug signalé"
bug_color = "#E74C3C"
feature_label = "✨ Ajout proposé"
feature_color = "#3498DB"

# Le message permanent à deux boutons, en tête du salon des tickets.
panel_title = "Signaler un bug ou proposer un ajout"
panel_text = """
Un souci en jeu ? Une idée pour le serveur ? Utilise les boutons ci-dessous.

**🐛 Signaler un bug** — quelque chose ne fonctionne pas comme prévu.
**✨ Proposer un ajout** — une fonctionnalité que tu aimerais voir arriver.

Ton signalement est publié ici avec ton nom, puis suivi par l'équipe technique :
❌ signalé · ⚠️ en cours de correction · ✅ testé et validé en ligne
"""


[behaviour]
# Le message permanent à boutons est-il épinglé automatiquement ?
pin_panel = true


[whitelist]
# Whitelist du serveur de jeu (décision Lucas, 16 septembre 2026) : tout membre
# qui porte l'un de ces rôles est autorisé à entrer en jeu, à condition d'avoir
# lié son Discord à son compte Steam sur le portail. Le bot envoie la liste des
# membres concernés au portail (adresse ci-dessous, réseau Docker du VPS, jamais
# Internet) à chaque changement de rôle et toutes les resync_seconds secondes.
# Le secret d'accès au portail est PORTAIL_SECRET dans .env.
portail_url = "http://grandline-portail:3000"
resync_seconds = 600
staff_roles = [
  1533804625206186055,  # 🔑 passe-all
  1548668864009601095,  # 🔱 Fondateurs
  1534727680463863979,  # ✯ Direction ✯
  1524700663924260942,  # 👑 Doyen
  1532717004761469099,  # 🧭 Coordinateur
  1544738329998925914,  # La Fée des discord
  1532718750950752387,  # ✯ Gérance ✯
  1532558047539630130,  # ⚓ Gérant Staff
  1532716821747204260,  # 🏴‍☠️ Gérant RP
  1532716822451851314,  # 📯 Gérant Community Manager
  1532716823655616594,  # 🎨 Gérant Graphiste
  1534725268814565456,  # 🧭 Gérant Mappeur
  1532719392536658130,  # ✯ Haut Staff ✯
  1524700663924260939,  # 🔧 Admin
  1532717002899062975,  # 🎲 MJ
  1536479115203444837,  # ⚓ Lead Marine
  1544741566541733898,  # 🏴‍☠️ Lead Pirate
  1544749503880503306,  # 🔨 Responsable Buildeur
  1524700663924260940,  # ✯ Staff ✯
  1532716885882441920,  # ⚔️ Modérateur +
  1524700663924260938,  # 🛡️ Modérateur
  1534725363194921071,  # 🖋️ Lore
  1532717004278988820,  # 🎨 Graphiste
  1532717003448651897,  # ⚖️ Equilibrage
  1524700663916007490,  # 🎉 Animateur
  1544745832593756251,  # 📯 Community Manager
  1544749222622928916,  # 🔨 Buildeur
]


[sanctions]
# Miroir des bans Discord vers le serveur de jeu (décision Lucas, 17 septembre
# 2026) : un ban posé ici devient un ban FAdmin en jeu, une levée le lève, par
# le portail (PUT /api/pont/bans, même adresse et même secret que la whitelist).
# Sens unique : un ban en jeu ne touche jamais au Discord.
# Pour relire la liste complète des bans à intervalle (rattrapage d'un
# événement manqué), le rôle du bot doit avoir « Bannir des membres » ; sans
# cette permission, seuls les bans et levées vus en direct partent.
# Les maîtres ne sont JAMAIS transmis : même bannis du Discord, ils restent
# maîtres du jeu. Même liste que MAITRES dans le portail (src/lib/staff.ts).
maitres = [
  277789607251410944,  # Altérax
  297731704976703498,  # Falcko
]


[support]
# Tickets de support des joueurs, unifiés avec le site (décision Lucas, 17
# septembre 2026) : le bot remplace Ticket Tool. Un message à boutons dans le
# salon support ouvre un ticket ; chaque ticket a son salon dans la catégorie
# TICKETS ; ce qui passe par le bouton « Répondre » arrive sur le site et dans
# le chat en jeu du joueur, ce qui s'écrit sur le site arrive dans le salon. Le
# bavardage libre du salon reste sur Discord (le bot ne lit pas le contenu des
# messages). À la fermeture, une transcription part dans le salon transcript
# et le salon du ticket est supprimé : l'historique complet vit sur le site.
# Même portail et même secret que [whitelist] ; désactivé sans eux.
#
# EN VEILLE depuis le 17 septembre 2026 (décision Lucas) : le staff garde le
# système de tickets déjà en place sur Discord. Tout le code reste ; passer
# enabled à true (et TICKETS_ACTIFS=1 côté portail) rallume l'ensemble.
enabled = false
panel_channel = 1524700664582901786        # #🎫〡support
category = 1524700665044271186             # ✦ TICKETS ✦
transcript_channel = 1535397307225346140   # #transcript
poll_seconds = 15
# Les catégories du site (site web/content/tickets.json) : mêmes identifiants.
categories = [
  { id = "hrp",        label = "Ticket HRP",  emoji = "🛠️" },
  { id = "boutique",   label = "Boutique",    emoji = "🪙" },
  { id = "rp",         label = "Demande RP",  emoji = "🎭" },
  { id = "suggestion", label = "Suggestion",  emoji = "💡" },
  { id = "autre",      label = "Autre",       emoji = "📩" },
]


[serveur]
# Pilotage du serveur de jeu depuis Discord (décision Lucas, 21 septembre
# 2026) : la commande /serveur (statut, start, stop, restart) n'est acceptée
# que dans le salon ci-dessous ET de la part d'un opérateur de la liste. Le
# bot parle à l'API mTxServ avec les identifiants MTXSERV_* de .env : les
# opérateurs ne voient ni le panneau, ni le FTP, ni RCON, ni la base. Retirer
# quelqu'un de cette liste suffit à lui retirer la main.
#
# Un stop ou un restart demande une confirmation par bouton ; si des joueurs
# sont en ligne, le serveur affiche d'abord son bandeau de compte à rebours
# pendant avertissement_secondes (le même message que le panneau mTxServ).
# La veille du VPS lit un stop demandé ici comme un arrêt voulu (dernier geste
# game_stop) : elle ne relance pas, elle annonce « Fermé par le staff ».
salon = 1549738297759113216                # salon dédié (staff)
operateurs = [
  785964198588055613,  # Sensei
  451177631518425089,  # Natsu
  277789607251410944,  # Altérax
  297731704976703498,  # Vaca (Falcko)
]
# Le serveur de jeu, sondé en A2S avant chaque geste (un start sur un
# serveur déjà allumé le couperait). Même adresse que la veille du VPS.
game_host = "185.206.151.148"
game_port = 27470
avertissement_secondes = 60
